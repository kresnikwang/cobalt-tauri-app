name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      YT_DLP_VERSION: '2025.11.12'
      PYTHON_BUILD_TAG: '20261003'
      PYTHON_VERSION: '3.12.15'
      GALLERY_DL_VERSION: '1.32.16'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version sync
        run: node scripts/sync-versions.mjs --check

      - name: Frontend type check
        run: pnpm check

      - name: Prepare bundled runtimes (needed by Tauri build script)
        run: pnpm prepare:release-bundle

      - name: Backend check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Go tests
        working-directory: sidecars/res-sniffer
        run: |
          go vet ./cmd/res-sniffer
          go test ./cmd/res-sniffer

      - name: API unit tests
        run: pnpm --dir api test:unit --run
